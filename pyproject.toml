[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "phantombars"
version = "1.0.0"
description = "Executable OHLC bar construction and the selection-fidelity experiment for phantom-print contamination in backtests"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Daniel Gatto"}]
dependencies = ["numpy>=1.23", "pandas>=2.0", "scipy>=1.9", "matplotlib>=3.6"]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[tool.setuptools]
packages = ["phantombars"]
